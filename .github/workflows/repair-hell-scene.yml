name: Repair hell scene

on:
  push:
    branches:
      - "automation/browser-preview-*"
    paths:
      - "scripts/repair_hell_scene.py"
      - ".github/workflows/repair-hell-scene.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Repair scene and source
        run: python3 scripts/repair_hell_scene.py

      - name: Validate generated PNG
        run: |
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('public/sprites/hell-reception-v1.png')
          image.verify()
          assert image.size == (1536, 1536)
          PY
          git diff --check

      - name: Commit repaired scene
        run: |
          if git diff --quiet; then
            echo "Scene already repaired"
            exit 0
          fi
          git config user.name "oathbound-scene-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/engine.ts src/game/world.ts scripts/island-content.test.mjs public/sprites/hell-reception-v1.png
          git commit -m "Repair the infernal reception scene"
          git push

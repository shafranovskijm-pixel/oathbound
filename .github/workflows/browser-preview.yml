name: Browser preview capture

on:
  push:
    branches:
      - "automation/browser-preview-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Chromium harness
        run: |
          mkdir -p /tmp/oathbound-capture
          cd /tmp/oathbound-capture
          npm init -y
          npm install --no-audit --no-fund playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Capture published game
        env:
          TARGET_URL: "https://oathbound-salt-keel.shafranovskij-m.chatgpt.site/"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/browser-preview"
          cd /tmp/oathbound-capture
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const output = `${process.env.GITHUB_WORKSPACE}/browser-preview`;
          const diagnostics = [];
          const browser = await chromium.launch({ headless: true });

          async function captureDesktop() {
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              locale: 'ru-RU',
            });
            const page = await context.newPage();
            page.on('console', (message) => {
              if (message.type() === 'error') diagnostics.push(`desktop console: ${message.text()}`);
            });
            page.on('pageerror', (error) => diagnostics.push(`desktop pageerror: ${error.message}`));
            page.on('requestfailed', (request) => diagnostics.push(`desktop requestfailed: ${request.url()} :: ${request.failure()?.errorText}`));

            const response = await page.goto(process.env.TARGET_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            diagnostics.push(`desktop status: ${response?.status() ?? 'no response'}`);
            await page.waitForTimeout(5000);
            await page.screenshot({ path: `${output}/01-menu-desktop.png`, fullPage: true });

            const start = page.getByRole('button', { name: /Начать с адского собеседования/i });
            const startVisible = await start.isVisible().catch(() => false);
            diagnostics.push(`start button visible: ${startVisible}`);
            if (startVisible) {
              await start.click();
              await page.waitForTimeout(1000);
              await page.screenshot({ path: `${output}/02-intro-first-line.png`, fullPage: true });

              const next = page.locator('.hell-dialogue button');
              for (let step = 3; step <= 7; step += 1) {
                if (!(await next.isVisible().catch(() => false))) break;
                await next.click();
                await page.waitForTimeout(850);
                await page.screenshot({ path: `${output}/0${step}-intro-or-level.png`, fullPage: true });
              }
            }

            diagnostics.push(`desktop title: ${await page.title()}`);
            diagnostics.push(`desktop final url: ${page.url()}`);
            await context.close();
          }

          async function captureMobile() {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'ru-RU',
            });
            const page = await context.newPage();
            page.on('pageerror', (error) => diagnostics.push(`mobile pageerror: ${error.message}`));
            const response = await page.goto(process.env.TARGET_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            diagnostics.push(`mobile status: ${response?.status() ?? 'no response'}`);
            await page.waitForTimeout(5000);
            await page.screenshot({ path: `${output}/08-menu-mobile.png`, fullPage: true });
            await context.close();
          }

          try {
            await captureDesktop();
            await captureMobile();
          } catch (error) {
            diagnostics.push(`fatal: ${error?.stack || error}`);
          } finally {
            await writeFile(`${output}/diagnostics.txt`, diagnostics.join('\n'));
            await browser.close();
          }
          NODE

      - name: Upload browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oathbound-browser-preview
          path: browser-preview
          if-no-files-found: error
          retention-days: 7

name: Repair clean build

on:
  push:
    branches:
      - "automation/browser-preview-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lock and run checks
        shell: bash
        run: |
          mkdir -p build-diagnostics
          set +e

          node --input-type=module <<'NODE' > build-diagnostics/versions-before.txt
          import lock from './package-lock.json' with { type: 'json' };
          const names = ['vite', 'react', 'react-dom', '@tanstack/react-start', '@tanstack/router-plugin', 'lru-cache'];
          for (const name of names) {
            const entry = lock.packages?.[`node_modules/${name}`];
            console.log(`${name}: ${entry?.version ?? 'missing'}`);
          }
          NODE

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund > build-diagnostics/01-lock.log 2>&1
          echo "lock=$?" >> build-diagnostics/status.txt
          git diff --stat -- package-lock.json > build-diagnostics/lock-diff-stat.txt

          node --input-type=module <<'NODE' > build-diagnostics/versions-after.txt
          import lock from './package-lock.json' with { type: 'json' };
          const names = ['vite', 'react', 'react-dom', '@tanstack/react-start', '@tanstack/router-plugin', 'lru-cache'];
          for (const name of names) {
            const entry = lock.packages?.[`node_modules/${name}`];
            console.log(`${name}: ${entry?.version ?? 'missing'}`);
          }
          NODE

          npm ci --no-audit --no-fund > build-diagnostics/02-ci.log 2>&1
          echo "ci=$?" >> build-diagnostics/status.txt

          npm run typecheck > build-diagnostics/03-typecheck.log 2>&1
          echo "typecheck=$?" >> build-diagnostics/status.txt

          npm test > build-diagnostics/04-tests.log 2>&1
          echo "tests=$?" >> build-diagnostics/status.txt

          npm run lint > build-diagnostics/05-lint.log 2>&1
          echo "lint=$?" >> build-diagnostics/status.txt

          VITE_AUTH_ENABLED=false npm run build:dev > build-diagnostics/06-build.log 2>&1
          echo "build=$?" >> build-diagnostics/status.txt

          find dist .output -maxdepth 4 -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort > build-diagnostics/output-files.txt
          cp package-lock.json build-diagnostics/package-lock.generated.json

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oathbound-build-repair
          path: build-diagnostics
          if-no-files-found: error
          retention-days: 7

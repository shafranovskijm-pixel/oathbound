name: Source snapshot

on:
  push:
    branches:
      - "automation/browser-preview-*"
  workflow_dispatch:

concurrency:
  group: oathbound-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: oathbound-source-snapshot
          path: |
            src
            public
            scripts
            server
            tests
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            README.md
          if-no-files-found: error
          retention-days: 2
